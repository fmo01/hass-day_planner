name: Lint & Formatting

permissions:
  contents: write

on:
  push:
    branches: [ main, unstable ]
    paths:
      - 'custom_components/**' # Se déclenche uniquement si des fichiers ici changent
  pull_request:
    branches: [ main, unstable ]
    paths:
      - 'custom_components/**' # Se déclenche uniquement si des fichiers ici changent
  workflow_dispatch: # Permet le déclenchement manuel
    paths:
      - 'custom_components/**' # Se déclenche uniquement si des fichiers ici changent

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: 📦 Installation des dépendances de dev
      run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
    
    - name: Run Black
      run: black custom_components/day_planner/
    
    - name: Run isort
      run: isort --profile black custom_components/day_planner/
    
    - name: Run flake8
      run: flake8 custom_components/day_planner/ --max-line-length=120
      
    #- name: Run Vulture (Détection de code mort)
    #  if: always()
    #  run: vulture custom_components/day_planner/  scripts/param/vulture_whitelist.py --ignore-names "_attr_*"
    
    - name: Auto-commit formatted code
      if: success() # S'exécute uniquement si toutes les étapes précédentes (Black, isort, flake8, vulture) ont réussi
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        if [[ -n "$(git status --porcelain)" ]]; then
          git add .
          git commit -m "Auto-fix: custom_components: Format code with black, isort and flake8 [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
