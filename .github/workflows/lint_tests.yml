name: Lint & Formatting scripts tests

permissions:
  contents: write

on:
  push:
    branches: [ main, unstable ]
    paths:
      - 'scripts/tests/**' # Se déclenche uniquement si des fichiers ici changent
      - "pyproject.toml"
      - "requirements-lint.txt"
      - ".github/workflows/lint_tests.yml"
  pull_request:
    branches: [ main, unstable ]
    paths:
      - 'scripts/tests/**' # Se déclenche uniquement si des fichiers ici changent
      - "pyproject.toml"
      - "requirements-lint.txt"
      - ".github/workflows/lint_tests.yml"
  workflow_dispatch: # Permet le déclenchement manuel

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      
    - name: Install Ruff
      uses: astral-sh/ruff-action@v4.1.0
      with:
        version-file: requirements-lint.txt
        args: "--version"

    - name: Sort imports
      if: github.event_name != 'pull_request'
      run: ruff check --select I --fix scripts/tests/

    - name: Format code
      if: github.event_name != 'pull_request'
      run: ruff format scripts/tests/

    - name: Check lint and formatting
      run: |
        ruff check scripts/tests/
        ruff format --check scripts/tests/
    
    #- name: Run Vulture (Détection de code mort)
    #  if: always()
    #  run: vulture custom_components/day_planner/  scripts/param/vulture_whitelist.py --ignore-names "_attr_*"
    
    - name: Auto-commit formatted code
      if: success() && github.event_name != 'pull_request' # S'exécute uniquement si toutes les étapes précédentes (Sort imports, Format code, Check lint and formatting ) ont réussi et pas suite a PR
      run: |
        git add -- scripts/tests/
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git commit -m "style: format scripts/tests/ with Ruff [skip ci]"
        git fetch origin "$GITHUB_REF_NAME"
        git rebase "origin/$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
