name: HACS Validate
on:
  push:
    branches: [ master, unstable ]
  pull_request:
    branches: [ master, unstable ]
  workflow_dispatch: # Permet le déclenchement manuel
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
