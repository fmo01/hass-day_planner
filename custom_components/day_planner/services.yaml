add_moment:
  name: Add moment
  description: Add a new moment to the planner.
  fields:
    id:
      name: Identifier
      description: Unique identifier of the moment.
      required: true
      example: reveil
      selector:
        text:
    name:
      name: Name
      description: Display name of the moment.
      required: true
      example: Réveil
      selector:
        text:
    icon:
      name: Icon
      description: Material Design Icons identifier.
      required: false
      example: mdi:alarm
      selector:
        icon:

update_moment:
  name: Update moment
  description: Update an existing moment.
  fields:
    id:
      name: Identifier
      description: Identifier of the moment to update.
      required: true
      example: reveil
      selector:
        text:
    name:
      name: Name
      description: New display name.
      required: true
      example: Petit déjeuner
      selector:
        text:
    icon:
      name: Icon
      description: Material Design Icons identifier.
      required: false
      example: mdi:coffee
      selector:
        icon:

remove_moment:
  name: Remove moment
  description: Remove an existing moment.
  fields:
    id:
      name: Identifier
      description: Identifier of the moment to remove.
      required: true
      example: reveil
      selector:
        text:

